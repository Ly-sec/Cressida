name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Select portability checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dave: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check encryption and build changes
        id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/scripts/dave_changes.py

  quality:
    name: Formatting and automation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: nix develop path:. -c just lint

  build:
    name: Build and test (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Build the locked package and run Meson tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          nix build --no-update-lock-file --print-build-logs --keep-failed \
            'path:.#checks.${{ matrix.system }}.client' 2>&1 | tee ci-logs/build.log
      - name: Offline Wayland smoke replays
        if: matrix.system == 'x86_64-linux'
        run: nix develop path:. -c env XDG_DATA_DIRS=/cressida-ci-no-host-data just smoke-headless result/bin/cressida
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.system }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  musl:
    name: Alpine musl
    uses: ./.github/workflows/ci-musl.yml

  dave:
    name: Portable DAVE
    needs: changes
    if: needs.changes.outputs.dave == 'true'
    uses: ./.github/workflows/ci-dave.yml

  required:
    name: CI passed
    if: always()
    needs: [changes, quality, build, musl, dave]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          DAVE_REQUIRED: ${{ needs.changes.outputs.dave }}
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
          MUSL: ${{ needs.musl.result }}
          DAVE: ${{ needs.dave.result }}
        run: |
          echo "Portability selection: $CHANGES (required=$DAVE_REQUIRED)"
          echo "Formatting and automation: $QUALITY"
          echo "Build and test: $BUILD"
          echo "Alpine musl build and test: $MUSL"
          echo "Portable DAVE: $DAVE"
          if test "$CHANGES" != success || test "$QUALITY" != success || test "$BUILD" != success || test "$MUSL" != success; then
            echo "::error::A prerequisite job did not succeed. Open the formatting and build job logs for the underlying error."
            exit 1
          fi
          if test "$DAVE_REQUIRED" = true && test "$DAVE" = success; then
            exit 0
          fi
          if test "$DAVE_REQUIRED" = false && test "$DAVE" = skipped; then
            exit 0
          fi
          echo "::error::Portable DAVE did not match the selected check policy. Open the portability job logs."
          exit 1
