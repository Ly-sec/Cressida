name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Formatting and automation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - run: nix develop path:. -c just lint

  build:
    name: Build and test (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Build the locked package and run Meson tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          nix build --no-update-lock-file --print-build-logs --keep-failed \
            'path:.#checks.${{ matrix.system }}.client' 2>&1 | tee ci-logs/build.log
      - name: Offline Wayland smoke replays
        if: matrix.system == 'x86_64-linux'
        run: nix develop path:. -c just smoke-headless result/bin/cressida
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.system }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: CI passed
    if: always()
    needs: [quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
        run: test "$QUALITY" = success && test "$BUILD" = success
