name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Ly-sec/Cressida'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against VERSION
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python3 .github/workflows/scripts/release_archive.py --check "$RELEASE_REF"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  packages:
    needs: checks
    uses: ./.github/workflows/release-packages.yml

  publish:
    needs: [checks, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download native release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-packages-*
          path: dist/
          merge-multiple: true
      - name: Create source archive and checksum
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 .github/workflows/scripts/release_archive.py "$RELEASE_REF"
          python3 .github/workflows/scripts/release_checksums.py "$RELEASE_REF"
      - name: Verify assets and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
        run: python3 .github/workflows/scripts/publish_release.py "$RELEASE_REF"
